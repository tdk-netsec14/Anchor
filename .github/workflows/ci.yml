name: CI

# Nothing here deploys. Deployment is a deliberate act with its own
# environment secrets; this workflow only proves the tree is sound.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Never a real secret. The production config validator only runs under
  # ENVIRONMENT=prod, which CI never sets.
  JWT_SECRET: ci-not-a-secret-0123456789abcdef

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy agent ingestion
        continue-on-error: true

      - name: Unit and integration tests
        run: pytest -m "not slow"

      - name: Evaluation harness as regression tests
        run: pytest eval -m "not slow"

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # A placeholder: the build must not need a reachable backend.
          ANCHOR_API_URL: http://127.0.0.1:8000

  migrations:
    name: Migrations — apply against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anchor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        # Only what the migration path imports; the ML stack is not needed to
        # prove the schema applies.
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115,<1.0" "pydantic>=2.9,<3.0" \
            "pydantic-settings>=2.6,<3.0" "sqlalchemy>=2.0,<3.0" \
            "alembic>=1.13" "psycopg[binary]>=3.2" "PyJWT>=2.9" "argon2-cffi"

      - name: Upgrade to head
        env:
          DATABASE_URL: postgresql+psycopg://anchor:anchor@localhost:5432/anchor
        run: python -m alembic upgrade head

      - name: Fail if the models have drifted from the migration
        env:
          DATABASE_URL: postgresql+psycopg://anchor:anchor@localhost:5432/anchor
        run: python -m alembic check

      - name: Downgrade and re-upgrade (the downgrade path works)
        env:
          DATABASE_URL: postgresql+psycopg://anchor:anchor@localhost:5432/anchor
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

  docker:
    name: Docker — images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the agent image
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: false
          tags: anchor-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security — dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # A dependency with a known advisory fails the build. `--strict`
          # turns "could not check" into a failure too, so a skipped check can
          # never be mistaken for a clean one.
          pip-audit -r agent/requirements.txt --strict --progress-spinner off

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Scan tracked files for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  production-config:
    name: Production config — refuses to start misconfigured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: A prod deployment with no database must not start
        env:
          ENVIRONMENT: prod
          JWT_SECRET: ${{ env.JWT_SECRET }}
          STORAGE_BACKEND: local
          CORS_ALLOWED_ORIGINS: "*"
        run: |
          python -c "
          from agent.main import validate_production_config
          try:
              validate_production_config()
          except RuntimeError as exc:
              print('refused as expected:'); print(exc); raise SystemExit(0)
          print('FAIL: an unconfigured prod deployment was allowed to start')
          raise SystemExit(1)
          "
